# Devcontainer compose override.
# Merged with the root docker-compose.yml so the dev service can reach the
# `postgres` service on the same compose network (hostname: postgres).
#
# Paths in this file are resolved relative to the FIRST compose file in the
# merge order (the root docker-compose.yml), so they are written as if
# the working directory is the repo root.
services:
  dev:
    build:
      context: ./.devcontainer
      dockerfile: Dockerfile
    volumes:
      - .:/workspaces/deuce:cached
      # Persist the Deuce SSH host key across rebuilds so VS Code's
      # known_hosts doesn't go stale on every devcontainer recreate.
      - deuce-ssh-host-key:/home/vscode/.deuce
    # docker-in-docker: run a Docker daemon inside this container so the DevPod
    # CLI can clone workspaces into the container's filesystem and mount those
    # paths into child containers without host/container path mismatches.
    privileged: true
    command: sleep infinity
    depends_on:
      - postgres

volumes:
  deuce-ssh-host-key:
