<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#151922;color:var(--fg)}
  .wrap{padding:20px;display:flex;gap:20px;align-items:center}
  .logo{width:240px;height:230px;border-radius:var(--radius-lg);display:block;flex-shrink:0;object-fit:contain;background:#161a23}
  .meta{display:flex;flex-direction:column;gap:14px}
  .meta .k{font-size:var(--text-xs);color:var(--brand-green);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .meta .v{font-size:var(--text-sm);color:var(--fg);margin-top:3px;line-height:1.5}
  .meta .v code{font-family:var(--font-mono);font-size:12px;color:var(--brand-green-bright)}
</style></head>
<body>
  <div class="wrap">
    <img class="logo" src="../assets/deuce-logo.png" alt="Deuce logo">
    <div class="meta">
      <div><div class="k">Mark</div><div class="v">Pixel / 8-bit lockup — a 2-of-clubs <em>deuce</em> card wired with circuit nodes, over the DEUCE wordmark.</div></div>
      <div><div class="k">Tagline</div><div class="v">Collaborative AI Programming</div></div>
      <div><div class="k">Color</div><div class="v">Phosphor green <code>#60C070</code> on CRT navy <code>#151922</code></div></div>
      <div><div class="k">Rule</div><div class="v">Use whole as a lockup. Don't recolor or stretch.</div></div>
    </div>
  </div>
</body></html>
