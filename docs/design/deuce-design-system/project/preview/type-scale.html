<!-- @dsCard group="Type" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--fg);padding:24px}
  .row{display:flex;align-items:baseline;gap:16px;padding:7px 0;border-bottom:1px solid var(--border-muted)}
  .row:last-child{border-bottom:0}
  .px{font-family:var(--font-mono);font-size:10px;color:var(--fg-subtle);width:70px;flex-shrink:0}
  .ex{color:var(--fg-emphasis)}
  .use{font-size:var(--text-xs);color:var(--fg-muted);margin-left:auto}
</style></head>
<body>
  <div class="row"><div class="px">18 / 600</div><div class="ex" style="font-size:18px;font-weight:600">Deuce</div><div class="use">wordmark · view title</div></div>
  <div class="row"><div class="px">16 / 600</div><div class="ex" style="font-size:16px;font-weight:600">Section heading</div><div class="use">rare</div></div>
  <div class="row"><div class="px">14 / 600</div><div class="ex" style="font-size:14px;font-weight:600">Author name · labels</div><div class="use">semibold</div></div>
  <div class="row"><div class="px">14 / 400</div><div class="ex" style="font-size:14px">Default body &amp; messages</div><div class="use">base</div></div>
  <div class="row"><div class="px">12 / 400</div><div class="ex" style="font-size:12px">Metadata &amp; descriptions</div><div class="use">xs</div></div>
  <div class="row"><div class="px">10 / 600</div><div class="ex" style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em">Eyebrows &amp; badges</div><div class="use">2xs · caps</div></div>
</body></html>
