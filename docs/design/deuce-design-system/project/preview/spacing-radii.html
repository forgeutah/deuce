<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--fg);padding:24px}
  .row{display:flex;gap:16px}
  .c{flex:1;text-align:center}
  .box{height:64px;background:var(--bg-emphasis);border:1px solid var(--border);margin-bottom:10px}
  .n{font-size:var(--text-xs);color:var(--fg-emphasis);font-weight:600}
  .v{font-family:var(--font-mono);font-size:10px;color:var(--fg-muted)}
  .u{font-size:10px;color:var(--fg-subtle);margin-top:2px}
</style></head>
<body>
  <div class="row">
    <div class="c"><div class="box" style="border-radius:4px"></div><div class="n">sm</div><div class="v">4px</div><div class="u">chips · code</div></div>
    <div class="c"><div class="box" style="border-radius:6px"></div><div class="n">md ◆ default</div><div class="v">6px</div><div class="u">buttons · inputs · cards</div></div>
    <div class="c"><div class="box" style="border-radius:8px"></div><div class="n">lg</div><div class="v">8px</div><div class="u">dialogs</div></div>
    <div class="c"><div class="box" style="border-radius:9999px"></div><div class="n">full</div><div class="v">9999px</div><div class="u">avatars · dots · pills</div></div>
  </div>
</body></html>
