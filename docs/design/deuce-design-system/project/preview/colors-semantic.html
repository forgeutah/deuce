<!-- @dsCard group="Colors" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--fg);padding:24px}
  .fam{margin-bottom:14px}
  .head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .head b{font-size:var(--text-xs);color:var(--fg-emphasis);font-weight:600;text-transform:capitalize}
  .head span{font-family:var(--font-mono);font-size:10px;color:var(--fg-subtle)}
  .row{display:flex;gap:10px}
  .c{flex:1}
  .c .bar{height:40px;border-radius:var(--radius-sm)}
  .c .n{font-family:var(--font-mono);font-size:9px;color:var(--fg-muted);margin-top:5px}
</style></head>
<body>
  <div class="fam">
    <div class="head"><b>Accent — Blue</b><span>the single product action color</span></div>
    <div class="row">
      <div class="c"><div class="bar" style="background:#58a6ff"></div><div class="n">accent · #58a6ff</div></div>
      <div class="c"><div class="bar" style="background:#1f6feb"></div><div class="n">emphasis · #1f6feb</div></div>
      <div class="c"><div class="bar" style="background:#0c2d6b"></div><div class="n">muted · #0c2d6b</div></div>
    </div>
  </div>
  <div class="fam">
    <div class="head"><b>Success</b></div>
    <div class="row">
      <div class="c"><div class="bar" style="background:#3fb950"></div><div class="n">#3fb950</div></div>
      <div class="c"><div class="bar" style="background:#238636"></div><div class="n">#238636</div></div>
      <div class="c"><div class="bar" style="background:#033a16"></div><div class="n">#033a16</div></div>
    </div>
  </div>
  <div class="fam" style="margin-bottom:0">
    <div class="head"><b>Danger / Warning</b></div>
    <div class="row">
      <div class="c"><div class="bar" style="background:#f85149"></div><div class="n">danger · #f85149</div></div>
      <div class="c"><div class="bar" style="background:#da3633"></div><div class="n">#da3633</div></div>
      <div class="c"><div class="bar" style="background:#d29922"></div><div class="n">warning · #d29922</div></div>
      <div class="c"><div class="bar" style="background:#9e6a03"></div><div class="n">#9e6a03</div></div>
    </div>
  </div>
</body></html>
