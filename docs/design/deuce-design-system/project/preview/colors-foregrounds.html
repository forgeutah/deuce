<!-- @dsCard group="Colors" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--bg);padding:24px}
  .stack{display:flex;flex-direction:column;gap:14px}
  .line{display:flex;align-items:baseline;gap:14px}
  .samp{flex:1}
  .samp .big{font-size:18px;font-weight:600}
  .lbl{font-family:var(--font-mono);font-size:var(--text-2xs);width:170px;flex-shrink:0}
  .hex{font-family:var(--font-mono);font-size:var(--text-2xs);color:#656C76}
</style></head>
<body>
  <div class="stack">
    <div class="line"><div class="lbl" style="color:#9198A1">fg-emphasis</div><div class="samp"><div class="big" style="color:#F0F6FC">Headings &amp; strong text</div></div><div class="hex">#F0F6FC</div></div>
    <div class="line"><div class="lbl" style="color:#9198A1">fg (default)</div><div class="samp"><div class="big" style="color:#D1D7E0">Body &amp; message text</div></div><div class="hex">#D1D7E0</div></div>
    <div class="line"><div class="lbl" style="color:#9198A1">fg-muted</div><div class="samp"><div class="big" style="color:#9198A1">Secondary / descriptions</div></div><div class="hex">#9198A1</div></div>
    <div class="line"><div class="lbl" style="color:#9198A1">fg-subtle</div><div class="samp"><div class="big" style="color:#656C76">Timestamps &amp; hints</div></div><div class="hex">#656C76</div></div>
    <div class="line"><div class="lbl" style="color:#9198A1">fg-on-emphasis</div><div class="samp"><div class="big" style="color:#fff;background:#1f6feb;display:inline-block;padding:2px 10px;border-radius:6px">On a fill</div></div><div class="hex">#FFFFFF</div></div>
  </div>
</body></html>
