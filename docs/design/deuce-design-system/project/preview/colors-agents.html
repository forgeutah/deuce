<!-- @dsCard group="Colors" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--fg);padding:24px}
  .grid{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:12px}
  .chip{width:34px;height:34px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;color:#fff;flex-shrink:0}
  .nm{font-size:var(--text-sm);font-weight:600;color:var(--fg-emphasis);width:84px}
  .role{font-size:var(--text-xs);color:var(--fg-muted);flex:1}
  .hex{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--fg-subtle)}
  .tint{font-family:var(--font-mono);font-size:10px;padding:3px 8px;border-radius:var(--radius-full)}
</style></head>
<body>
  <div class="grid">
    <div class="row"><div class="chip" style="background:#58a6ff">C</div><div class="nm">Coder</div><div class="role">Writes &amp; modifies code</div><div class="tint" style="background:#0c2d6b;color:#58a6ff">blue</div><div class="hex">#58a6ff</div></div>
    <div class="row"><div class="chip" style="background:#BE8FFF">R</div><div class="nm">Reviewer</div><div class="role">Reviews diffs critically</div><div class="tint" style="background:#3c1e70;color:#BE8FFF">purple</div><div class="hex">#BE8FFF</div></div>
    <div class="row"><div class="chip" style="background:#3fb950">P</div><div class="nm">Planner</div><div class="role">Breaks work into plans</div><div class="tint" style="background:#033a16;color:#3fb950">green</div><div class="hex">#3fb950</div></div>
    <div class="row"><div class="chip" style="background:#d29922">T</div><div class="nm">Tester</div><div class="role">Writes &amp; runs tests</div><div class="tint" style="background:#4b2900;color:#d29922">yellow</div><div class="hex">#d29922</div></div>
    <div class="row"><div class="chip" style="background:#f778ba">D</div><div class="nm">Designer</div><div class="role">UI/UX suggestions</div><div class="tint" style="background:#5e103e;color:#f778ba">pink</div><div class="hex">#f778ba</div></div>
  </div>
</body></html>
