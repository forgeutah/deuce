<!-- @dsCard group="Colors" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--fg);padding:24px}
  .scale{display:flex;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border)}
  .step{flex:1;height:72px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
  .step span{font-family:var(--font-mono);font-size:9px}
  .labels{display:flex;margin-top:8px}
  .labels div{flex:1;text-align:center;font-family:var(--font-mono);font-size:9px;color:var(--fg-subtle)}
  .cap{font-size:var(--text-xs);color:var(--fg-muted);margin-top:16px}
</style></head>
<body>
  <div class="scale">
    <div class="step" style="background:#010409"><span style="color:#9198A1">0</span></div>
    <div class="step" style="background:#0D1117"><span style="color:#9198A1">1</span></div>
    <div class="step" style="background:#151B23"><span style="color:#9198A1">2</span></div>
    <div class="step" style="background:#212830"><span style="color:#9198A1">3</span></div>
    <div class="step" style="background:#262C36"><span style="color:#9198A1">4</span></div>
    <div class="step" style="background:#2A313C"><span style="color:#B7BDC8">5</span></div>
    <div class="step" style="background:#2F3742"><span style="color:#B7BDC8">6</span></div>
    <div class="step" style="background:#3D444D"><span style="color:#D1D7E0">7</span></div>
    <div class="step" style="background:#656C76"><span style="color:#010409">8</span></div>
    <div class="step" style="background:#9198A1"><span style="color:#010409">9</span></div>
    <div class="step" style="background:#B7BDC8"><span style="color:#010409">10</span></div>
    <div class="step" style="background:#D1D7E0"><span style="color:#010409">11</span></div>
    <div class="step" style="background:#F0F6FC"><span style="color:#010409">12</span></div>
  </div>
  <div class="cap">Primer dark neutral scale — 0 deepest inset, 12 brightest text. Every surface, border &amp; muted text comes from here.</div>
</body></html>
