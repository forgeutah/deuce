name: release

# Fires on semver-shaped tags only (v1.2.3, v0.1.0-rc.1, etc.). Non-semver
# tags do not trigger.
on:
  push:
    tags:
      - 'v*.*.*'
  # workflow_dispatch lets you re-run the release against an existing tag if a
  # previous run failed mid-flight (e.g. transient GHCR error). Trigger from
  # the Actions tab and select the tag ref in the dropdown.
  workflow_dispatch:

permissions:
  contents: write   # gh release create
  packages: write   # ghcr push
  id-token: none

# Per-tag serialization. Never cancel mid-push — half-pushed GHCR manifests
# are recoverable but ugly.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/forgeutah/deuce

jobs:
  test:
    if: github.repository == 'forgeutah/deuce'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: deuce
          POSTGRES_PASSWORD: deuce
          POSTGRES_DB: deuce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deuce -d deuce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install JS deps
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript typecheck
        # Build mode, not a bare --noEmit: the root tsconfig is solution-style
        # ("files": [] plus project references), so `tsc --noEmit` compiles zero
        # files and exits 0 no matter what. This step checked nothing until now.
        run: npx tsc -b --noEmit
      - name: Go tests (integration enabled via TEST_DATABASE_URL)
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://deuce:deuce@localhost:5432/deuce?sslmode=disable
        # -p 1 runs PACKAGES serially, matching ci.yml. The db, handler and
        # sshproxy integration packages each reset the schema on the SAME
        # database, so running them in parallel fails outright. Without this
        # the release cannot publish — the test job dies before the image is
        # ever built.
        run: go test -p 1 ./...

  frontend_build:
    if: github.repository == 'forgeutah/deuce'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  build_and_release:
    if: github.repository == 'forgeutah/deuce'
    needs: [test, frontend_build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # fetch-depth: 0 keeps tag history available for any future
          # changelog tooling. --generate-notes uses the API and doesn't
          # need it today, but the cost is negligible.
          fetch-depth: 0

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags produced for tag v1.2.3 (non-prerelease):
      #   ghcr.io/forgeutah/deuce:1.2.3
      #   ghcr.io/forgeutah/deuce:1.2
      #   ghcr.io/forgeutah/deuce:latest
      #   ghcr.io/forgeutah/deuce:sha-<full sha>
      # Prerelease (v1.2.3-rc.1): same shapes EXCEPT :latest (auto-skips).
      # {{major}} pattern intentionally omitted until v1.0.0 (avoids :0 tag).
      - name: Compute image tags + labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=sha-
          flavor: |
            latest=auto

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT

          # docker/metadata-action strips the leading 'v' from semver tags
          # (OCI convention), so v1.2.3 produces image tag :1.2.3. The pull
          # command in the release notes has to match that, not the git tag.
          IMAGE_TAG="${TAG_NAME#v}"

          # Header: how to pull the image. Comes first so it's the first thing
          # readers see when they click into the release.
          {
            echo "## Container image"
            echo ""
            echo '```'
            echo "docker pull ${IMAGE_NAME}:${IMAGE_TAG}"
            echo '```'
            echo ""
            echo "---"
            echo ""
          } > "$notes_file"

          # Auto-generated release notes from the merged PRs since the prior tag.
          # First-ever release diffs from the initial commit (potentially long).
          gh api "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${TAG_NAME}" \
            --jq .body >> "$notes_file"

          # Mark prereleases explicitly (any semver tag with a hyphen).
          prerelease_flag=""
          case "${TAG_NAME}" in
            *-*) prerelease_flag="--prerelease" ;;
          esac

          # shellcheck disable=SC2086  # we want $prerelease_flag to word-split
          gh release create "${TAG_NAME}" \
            --verify-tag \
            --title "${TAG_NAME}" \
            --notes-file "$notes_file" \
            $prerelease_flag
